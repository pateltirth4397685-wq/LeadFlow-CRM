<!doctype html>
{% include "partials/app_start.html" %}<div class="mb-4"><div class="eyebrow">ACCOUNT</div><h1 class="page-title">Your profile</h1></div><div class="card p-4 col-lg-8"><form method="post"><label>Name</label><input class="form-control mb-3" name="name" value="{{ current_user.name }}" required><label>Email</label><input class="form-control mb-3" value="{{ current_user.email }}" disabled><label>Phone</label><input class="form-control mb-3" name="phone" value="{{ current_user.phone or '' }}"><label>New password</label><input class="form-control mb-3" name="password" type="password" placeholder="Leave blank to keep current"><button class="btn btn-primary">Update profile</button></form></div>{% include "partials/app_end.html" %}
