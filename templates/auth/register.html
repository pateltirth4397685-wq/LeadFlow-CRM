<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title or "LeadFlow CRM" }}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet"></head><body><div class="auth-page"><div class="auth-card"><div class="brand justify-content-center mb-4"><span class="brand-mark"><i class="bi bi-lightning-charge-fill"></i></span> LeadFlow</div><h1>Create your account</h1><p class="text-muted mb-4">Start managing your sales pipeline today.</p><form method="post"><input class="form-control mb-3" name="name" placeholder="Full name" required><input class="form-control mb-3" name="email" type="email" placeholder="Email" required><input class="form-control mb-3" name="phone" placeholder="Phone"><input class="form-control mb-3" name="password" type="password" placeholder="Password (8+ characters)" required><input class="form-control mb-3" name="confirm_password" type="password" placeholder="Confirm password" required><button class="btn btn-primary w-100">Create account</button></form><p class="text-center mt-4 mb-0">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="{{ url_for('static', filename='js/app.js') }}"></script></body></html>
