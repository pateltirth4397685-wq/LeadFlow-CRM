<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title or "LeadFlow CRM" }}</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet"></head><body><div class="auth-page"><div class="auth-card text-center"><div class="brand justify-content-center mb-4"><span class="brand-mark"><i class="bi bi-lightning-charge-fill"></i></span> LeadFlow</div><h1>Verify your email</h1><p class="text-muted">Enter the 6-digit code sent to {{ email }}.</p>{% if dev_otp %}<div class="demo-hint mb-3">Development code: <strong>{{ dev_otp }}</strong></div>{% endif %}<form method="post" action="{{ url_for('verify') }}"><input type="hidden" name="email" value="{{ email }}"><input class="form-control text-center fs-4 letter-spacing mb-3" name="otp" maxlength="6" required><button class="btn btn-primary w-100">Verify account</button></form></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="{{ url_for('static', filename='js/app.js') }}"></script></body></html>
